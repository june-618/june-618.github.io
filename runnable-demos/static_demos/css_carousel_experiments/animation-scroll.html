<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000000;
        }

        @keyframes qwe2 {
            0% {
                opacity: 0;
                transform: rotateZ(0);

            }

            100% {
                opacity: 1;

                transform: rotateZ(360deg);
            }
        }

        @keyframes qwe {
            0% {
                background: #ffff00;

            }

            100% {
                background: #00ffff;

            }
        }

        .scroll {
            width: 700px;
            height: 700px;
            background: #ffff00;
            overflow: auto;
            position: relative;



            animation-fill-mode: both;
            animation: qwe 1s linear;
            animation-timeline: scroll(self block);
            animation-range: 0% 100%;


        }

        .animation-box {
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: sticky;
            top: 0%;
            left: 0%;
            z-index: 4;

            animation-fill-mode: both;
            animation: qwe2 1s linear;
            animation-timeline: scroll(nearest block);
            animation-range: 0% 100%;


            background: #0000ff;



            /* animation-fill-mode: both;
            animation-name: qwe;
            animation-timeline: view();
            animation-range: entry 10% exit 100%;
            margin: 90vh 0; */

        }
    </style>
</head>

<body>
    <div class="scroll">
        <div class="animation-box"></div>
        <div style="height: 300vh">ddd</div>
    </div>

</body>

</html>
