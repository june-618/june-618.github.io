<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            margin: 0;
            padding: 0;
            background:#000000;
        }
        @keyframes qwe {
            0% {
                opacity: 0;
                transform: translate(0, 100px, 0);
            }

            50% {
                opacity: 1;
                transform: translate(0, 100vh, 0);
            }
            100% {
                opacity: 0;
                transform: translate(0, 200vh, 0);
            }
        }

        .animation-box {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;


            animation-fill-mode: both;
            animation-name: qwe;
            animation-timeline: view();
            animation-range: entry 10% exit 100%;
            margin: 90vh 0;
        }

        .animation-box .scroll {
            width: 100%;
            height: 100%;
            font-size: 50px;
            padding-right: 20px;
            background: #ffff00;
            animation: scroll 1s linear infinite;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="animation-box">
        <div class="scroll">n</div>
        <div class="scroll">n</div>
        <div class="scroll">n</div>
        <div class="scroll">n</div>
        <div class="scroll">n</div>
        <div class="scroll">n</div>
        <div class="scroll">n</div>
        <div class="scroll">n</div>
        <div class="scroll">n</div>
        <div class="scroll">n</div>
    </div>
    <div></div>
</body>

</html>
